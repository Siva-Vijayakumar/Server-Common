name: ServerCommon Precheck

on:
  workflow_dispatch:

jobs:

  precheck:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Execute Precheck
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          python scripts/aws_precheck.py

      - name: Send Cliq Notification
        env:
          CLIQ_WEBHOOK: ${{ secrets.CLIQ_WEBHOOK }}
        run: |
          python scripts/send_cliq.py

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: server-report
          path: reports/server_report.json